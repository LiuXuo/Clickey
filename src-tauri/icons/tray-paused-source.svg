<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
>
  <title>Clickey tray icon paused</title>
  <defs>
    <linearGradient id="tray-paused-left-vertical-gradient" x1="168" y1="88" x2="184" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7B7B7" />
      <stop offset="100%" stop-color="#9A9A9A" />
    </linearGradient>
    <linearGradient id="tray-paused-right-vertical-gradient" x1="344" y1="424" x2="328" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7B7B7" />
      <stop offset="100%" stop-color="#9A9A9A" />
    </linearGradient>
    <linearGradient id="tray-paused-top-horizontal-gradient" x1="424" y1="168" x2="88" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7B7B7" />
      <stop offset="100%" stop-color="#8C8C8C" />
